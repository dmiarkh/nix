[bar]
order = [ "main" ]

    [bar.main]
    capsule = true
    capsule_opacity = 0.69999998435378075
    capsule_radius = 4
    center = [ "workspaces" ]
    end = [ "media", "tray", "bluetooth", "volume", "input_volume", "battery", "network", "clock", "notifications" ]
    margin_ends = 0
    padding = 4
    radius = 0
    shadow = false
    start = [ "widget", "active_window" ]

[brightness]
enable_ddcutil = true

[control_center]
width = 800

[desktop_widgets]
enabled = false

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 1800.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 610.0

[location]
auto_locate = true

[lockscreen]
transition = [ "zoom" ]
transition_duration = 500

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@HDMI-A-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 879.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = false
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 96.0
    box_width = 256.0
    cx = 960.0
    cy = 252.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        font_family = "CommitMono"
        shadow = false

[nightlight]
enabled = true
temperature_night = 3500

[notification]
layer = "overlay"
max_visible = 5
show_actions = false

[plugins]
enabled = [ "thepunkoff/pomodoro" ]

[shell]
clipboard_auto_paste = "off"
launch_apps_as_systemd_services = true

    [shell.animation]
    speed = 1.5000000223517418

    [shell.launcher]
    auto_paste = "off"
    categories = false
    layout = "simple"
    sort_by_usage = false

    [shell.panel]
    open_near_click_control_center = true

    [shell.screenshot]
    annotate = true
    directory = "/home/dima/Pictures/Screenshots"

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot_uefi"
        countdown_seconds = 0.0
        enabled = true
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.window_switcher]
    mru = true

[system.monitor]
enabled = false

[theme]
builtin = "Ayu"
community_palette = "Catppuccin Mocha Lavender"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/dima/Pictures/Wallpapers"
directory_dark = "/home/dima/Pictures/Wallpapers"
directory_light = "/home/dima/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/dima/Pictures/Wallpapers/pepe.png"

    [wallpaper.last]
    path = "/home/dima/Pictures/Wallpapers/pepe.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/dima/Pictures/Wallpapers/pepe.png"

    [[wallpaper.favorite]]
    community_palette = "ADW"
    palette_source = "community"
    path = "/home/dima/Pictures/Wallpapers/pepe.png"
    theme_mode = "dark"

[widget.active_window]
capsule = true
font_scale = 0.90000000000000013
icon_size = 20
max_length = 600
title_scroll = "on_hover"

[widget.battery.actions]
right = "exec ghostty -e auto-cpufreq --stats"

[widget.clock]
format = "{:%A, %e %b, %R}"

[widget.media]
art_size = 20
capsule = false
capsule_opacity = 0.0
hide_when_no_media = true
max_length = 260
scale = 0.90000000000000013
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.widget]
type = "thepunkoff/pomodoro:widget"
widget-glyph-main = "code"

[widget.workspaces]
active_pill_size = 2.0
capsule = true
capsule_opacity = 0.0
capsule_radius = 8
font_weight = 700
inactive_pill_size = 1.3
occupied_color = "surface_container"
